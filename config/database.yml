# The login comes from OPENCOURTS_PROKURATURA_DATABASE_HOST, _USER and _PASSWORD. In development and test, dotenv-rails
# loads them from .env and .env.test, which bin/setup creates from .env.example and .env.test.example and CI from
# .env.ci; without them, the login in Rails credentials applies, then PostgreSQL's default (your own user). Production
# reads them from the server's environment.
default: &default
  adapter: postgresql
  pool: 30
  timeout: 100
  encoding: unicode
  host: <%= ENV.fetch('OPENCOURTS_PROKURATURA_DATABASE_HOST', 'localhost') %>
  username: <%= ENV.fetch('OPENCOURTS_PROKURATURA_DATABASE_USER') { Rails.application.credentials.dig(:postgresql, :username) } %>
  password: <%= ENV.fetch('OPENCOURTS_PROKURATURA_DATABASE_PASSWORD') { Rails.application.credentials.dig(:postgresql, :password) } %>

development:
  <<: *default
  database: opencourts_prokuratura_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: opencourts_prokuratura_test

production:
  <<: *default
  database: opencourts_prokuratura_production
  username: <%= ENV['OPENCOURTS_PROKURATURA_DATABASE_USER'] %>
  password: <%= ENV['OPENCOURTS_PROKURATURA_DATABASE_PASSWORD'] %>
