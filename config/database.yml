# The login comes from OPENCOURTS_PROKURATURA_DATABASE_HOST, _USER and _PASSWORD. In development and test, dotenv-rails
# loads them from .env and .env.test, which bin/setup creates from .env.example and .env.test.example and CI from
# .env.ci; without them, PostgreSQL's default applies (your own user). Production reads them from the server's
# environment (the deploy user's ~/.env).
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('OPENCOURTS_PROKURATURA_DATABASE_HOST', 'localhost') %>
  username: <%= ENV['OPENCOURTS_PROKURATURA_DATABASE_USER'] %>
  password: <%= ENV['OPENCOURTS_PROKURATURA_DATABASE_PASSWORD'] %>
  max_connections: 30
  # libpq's GSSAPI negotiation crashes forked processes on macOS; nothing here uses Kerberos.
  gssencmode: disable

development:
  <<: *default
  database: opencourts_prokuratura_development

# The locale decides how text sorts and what LOWER does to Č or Ž (nothing in C), so the test database has the one CI's
# server and, most likely, production's have, whatever this machine's server defaults to. A locale other than
# template1's needs template0.
test:
  <<: *default
  database: opencourts_prokuratura_test
  template: template0
  collation: en_US.UTF-8
  ctype: en_US.UTF-8

production:
  <<: *default
  database: opencourts_prokuratura_production
